[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-explorer"
version = "0.1.0"
description = "German day-ahead electricity price explorer: negative prices, duck curve, tariff simulator"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy>=1.26", "pyarrow>=17.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.7"]
viz = ["altair>=5.2", "streamlit>=1.33"]
ml = ["scikit-learn>=1.4"]
all = ["energy-explorer[viz,ml]"]

[tool.hatch.build.targets.wheel]
packages = ["src/energy"]

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
